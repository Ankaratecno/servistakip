name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Collect static output
        run: |
          set -e
          if [ -d ".output/public" ]; then SRC=".output/public";
          elif [ -d "dist/client" ]; then SRC="dist/client";
          elif [ -d "dist" ]; then SRC="dist";
          else echo "Build cikti klasoru bulunamadi"; exit 1; fi
          echo "Kullanilan klasor: $SRC"
          rm -rf ./_site && mkdir -p ./_site
          cp -r "$SRC"/. ./_site/
          touch ./_site/.nojekyll
          # SPA fallback: alt sayfalar (/driver, /admin) yenilenince 404 olmasin
          if [ -f ./_site/index.html ]; then cp ./_site/index.html ./_site/404.html; fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
