name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Prepare GitHub Pages files
        run: |
          if [ -d ".output/public" ]; then
            mkdir -p ./gh-pages
            cp -r .output/public/* ./gh-pages/
          elif [ -d "dist" ]; then
            mkdir -p ./gh-pages
            cp -r dist/* ./gh-pages/
          else
            echo "Build output not found"
            exit 1
          fi

          # SPA/TanStack Router deep link desteği için
          cp ./gh-pages/index.html ./gh-pages/404.html

          # GitHub Pages Jekyll işlemeyi kapat
          touch ./gh-pages/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
