<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Beyaz 2016 VW Crafter servis minibüsü, üstten görünüm; ön taraf aşağı bakar -->
  <g>
    <!-- yan aynalar (siyah) -->
    <rect x="5.6" y="29" width="4.2" height="3.4" rx="1.6" fill="#111827" stroke="#0b0f14" stroke-width="0.8"/>
    <rect x="38.2" y="29" width="4.2" height="3.4" rx="1.6" fill="#111827" stroke="#0b0f14" stroke-width="0.8"/>
    <!-- beyaz gövde -->
    <rect x="10" y="4" width="28" height="40" rx="7" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <!-- tavan (hafif gölge) -->
    <rect x="14" y="7" width="20" height="17" rx="4" fill="#e2e8f0"/>
    <!-- arka cam -->
    <rect x="16" y="7" width="16" height="3" rx="1.5" fill="#1e293b" opacity="0.9"/>
    <!-- ön cam (aşağıda, koyu) -->
    <path d="M14 31.5 h20 v4.5 a4.5 4.5 0 0 1 -4.5 4.5 h-11 a4.5 4.5 0 0 1 -4.5 -4.5 z" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <!-- ön tampon / panjur -->
    <rect x="12" y="41" width="24" height="2.4" rx="1.2" fill="#64748b"/>
    <!-- farlar -->
    <rect x="12.6" y="40.6" width="5" height="2.6" rx="1.3" fill="#fde68a" stroke="#334155" stroke-width="0.8"/>
    <rect x="30.4" y="40.6" width="5" height="2.6" rx="1.3" fill="#fde68a" stroke="#334155" stroke-width="0.8"/>
  </g>
</svg>
