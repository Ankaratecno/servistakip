<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Beyaz 2016 VW Crafter v2 (yan camlı), üstten görünüm; ön taraf aşağı bakar -->
  <g>
    <!-- yan aynalar (siyah) -->
    <rect x="6.2" y="28" width="3.8" height="4.6" rx="1.7" fill="#111827" stroke="#0b0f14" stroke-width="0.8"/>
    <rect x="38" y="28" width="3.8" height="4.6" rx="1.7" fill="#111827" stroke="#0b0f14" stroke-width="0.8"/>
    <!-- beyaz gövde -->
    <rect x="10.6" y="3" width="26.8" height="42" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
    <!-- yan cam bantları -->
    <rect x="12.4" y="9" width="2.6" height="18" rx="1.3" fill="#1e293b" opacity="0.85"/>
    <rect x="33" y="9" width="2.6" height="18" rx="1.3" fill="#1e293b" opacity="0.85"/>
    <!-- tavan -->
    <rect x="16.4" y="8" width="15.2" height="18" rx="3.5" fill="#e2e8f0"/>
    <!-- ön cam (aşağıda, geniş ve koyu) -->
    <path d="M13.4 30 h21.2 v5 a5 5 0 0 1 -5 5 h-11.2 a5 5 0 0 1 -5 -5 z" fill="#0f172a" stroke="#334155" stroke-width="1.2"/>
    <!-- cam silecek çizgisi -->
    <line x1="16" y1="37.8" x2="32" y2="37.8" stroke="#334155" stroke-width="0.9" opacity="0.7"/>
    <!-- panjur (VW tarzı) -->
    <rect x="18" y="41.2" width="12" height="2.4" rx="1.2" fill="#1e293b"/>
    <!-- farlar (yuvarlak) -->
    <circle cx="15.2" cy="42.4" r="1.8" fill="#fde68a" stroke="#334155" stroke-width="0.8"/>
    <circle cx="32.8" cy="42.4" r="1.8" fill="#fde68a" stroke="#334155" stroke-width="0.8"/>
  </g>
</svg>
